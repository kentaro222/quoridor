<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUORIDOR — LCD</title>
<style>
:root{--ink:#384837;--lcd:#bcc99b;--red:#d95757;--black:#30332d;--shadow:#8e9c77;--blue:#4669a6;--yellow:#ffb600}*{box-sizing:border-box}body{margin:0;background:#eeeee7;color:#363933;font-family:ui-monospace,'Courier New',monospace;padding:24px 12px 40px}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;gap:12px}.brand{font-size:19px;font-weight:900;letter-spacing:2px}select{border:0;background:#cac6bb;border-radius:5px;padding:8px;font-size:12px;color:#454941}.screen{background:var(--lcd);border:2px solid #2e372b;padding:12px 14px;box-shadow:inset 3px 4px 8px #52604560;color:var(--ink);position:relative}.status{display:flex;align-items:center;gap:24px;font-size:19px;min-height:25px;margin-bottom:10px;font-weight:bold}.goal{height:5px;background:var(--black);margin:3px 0 7px;opacity:.8}.goal.bottom{background:var(--red);margin:7px 0 3px}.board{width:100%;aspect-ratio:1;position:relative;touch-action:manipulation;isolation:isolate}.cell{position:absolute;background:#65765335;border:1px solid #5363424a;padding:0;border-radius:1px}.cell.legal:after{content:'';position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);opacity:.6}.cell.legal:hover{background:#65765365}.wall{position:absolute;background:var(--ink);pointer-events:none;box-shadow:1px 1px #e3e8c133}.slot{position:absolute;border:0;padding:0;background:transparent;z-index:4}.slot:hover{background:#38483766}.slot.bad:hover{background:#d9575780}.pawn{position:absolute;z-index:6;width:10%;height:10%;pointer-events:none;display:grid;place-items:center;filter:drop-shadow(2px 2px 0 var(--shadow))}.sprite{width:100%;height:100%;background-size:200% 100%;background-repeat:no-repeat;image-rendering:pixelated;background-position:0 0}.pawn.stepping .sprite{animation:step 1.2s steps(1) infinite}.pawn.right .sprite{transform:scaleX(-1)}@keyframes step{50%{background-position:100% 0}}.fallback{width:60%;height:60%;background:var(--black);border-radius:50%;position:absolute}.pawn[data-player="1"] .fallback{background:var(--red)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 15px}.controls button{border:1px solid #a5ac98;border-radius:3px;background:transparent;min-height:48px;color:#454d42}.controls button.active{background:#535e50;color:#f0f0dc}.controls button:active{background:#73806a}.symbol{display:block;font-size:26px;line-height:30px}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.minor{display:flex;gap:10px}.minor button{background:transparent;border:1px solid #a5ac98;border-radius:3px;padding:8px 14px;font-size:12px;color:#454d42}.message{text-align:center;font-size:11px;min-height:18px;margin:16px 0 0;color:#65695e}.help{max-width:550px;margin:22px auto 0;font-size:11px;line-height:1.9;color:#72766a}button:disabled{cursor:default;opacity:.5}@media(max-width:450px){body{padding:12px 8px 25px}.screen{padding:9px}.brand{font-size:16px}.controls{gap:8px;margin-top:16px}.controls button{border:1px solid #a5ac98;border-radius:3px;background:transparent;min-height:48px;color:#454d42}}@media(prefers-reduced-motion:reduce){.pawn.stepping .sprite{animation:none}}
.machine{max-width:520px;margin:auto}.wall-count{display:flex;align-items:center;gap:7px}.count-square{display:inline-block;width:12px;height:12px;border:2px solid var(--ink)}.count-square.black{background:var(--black);border-color:var(--black)}.count-square.red{background:var(--red);border-color:var(--red)}.help{max-width:520px}.message.win{font-size:clamp(28px,7vw,36px);font-weight:900;letter-spacing:2px;line-height:1.25}.message:empty{display:none}@media(max-width:450px){body{padding:16px 12px 25px}.brand{font-size:15px;letter-spacing:1px}header{gap:8px}select{font-size:11px}}
.arena{display:grid;grid-template-columns:5px minmax(0,1fr) 5px;gap:7px;align-items:stretch}.arena .board{grid-column:2;grid-row:1}.goal.side{height:auto;margin:0;grid-row:1}.yellow-goal{grid-column:1;background:var(--yellow)}.blue-goal{grid-column:3;background:var(--blue)}.goal[hidden]{display:block;visibility:hidden}.pawn[data-player="2"] .fallback{background:var(--blue)}.pawn[data-player="3"] .fallback{background:var(--yellow)}.count-square.blue{background:var(--blue);border-color:var(--blue)}.count-square.yellow{background:var(--yellow);border-color:var(--yellow)}
</style></head><body>
<main class="machine"><header><div><div class="brand">QUORIDOR</div></div><select id="opponent" aria-label="Opponent"><option value="cpu">vs CPU</option><option value="human">2 Players</option><option value="three">3 Players</option><option value="four">4 Players</option></select></header>
<section class="screen" aria-label="LCD game screen"><div class="status" id="stocks" aria-label="Walls remaining" aria-live="polite"></div><div class="goal" aria-label="Black goal"></div><div class="arena"><div class="goal side yellow-goal" id="yellowGoal" aria-label="Yellow goal" hidden></div><div class="board" id="board" aria-label="9 by 9 board"></div><div class="goal side blue-goal" id="blueGoal" aria-label="Blue goal" hidden></div></div><div class="goal bottom" aria-label="Red goal"></div></section>
<div class="controls" aria-label="Controls"><button data-mode="move" class="active" aria-label="Move" title="Move"><span class="symbol" aria-hidden="true">✥</span></button><button data-mode="h" aria-label="Horizontal wall" title="Horizontal wall"><span class="symbol" aria-hidden="true">━</span></button><button data-mode="v" aria-label="Vertical wall" title="Vertical wall"><span class="symbol" aria-hidden="true">┃</span></button></div>
<div class="footer"><div class="minor"><button id="undo">Undo</button><button id="reset">Reset</button></div></div><p class="message" id="message" aria-live="polite"></p></main>
<details class="help" lang="ja"><summary>遊び方</summary><p>CPU対戦では黒が自分、赤が相手です。黒は上の黒い帯、赤は下の赤い帯を目指そう。3人・4人対戦では青は右、黄色は左の同じ色の帯を目指します。先手は毎回ランダム。その後は黒→赤→青→黄の順で、参加している色に手番が回ります。手番の駒だけが足踏みします。壁は2マス分で、9×9の盤面で、2人戦は各10枚、3人戦は各6枚、4人戦は各5枚。全員にゴールへの道が残る場所に置けます。隣の駒を1体だけ飛び越せます。背後が壁や盤外なら横に回り込めますが、別の駒がいるマスや2体を続けて飛び越す移動はできません。</p></details>
<script>
'use strict';
const N=9,CELL=100/N-1.1,board=document.getElementById('board'),byId=id=>document.getElementById(id);let state,mode='move',busy=false,history=[],timer,epoch=0;const images=['black_mouse.png','red_mouse.png','blue_mouse.png','yellow_mouse.png'],loaded=[false,false,false,false],names=['Black','Red','Blue','Yellow'],colors=['black','red','blue','yellow'];
images.forEach((src,i)=>{const im=new Image;im.onload=()=>{loaded[i]=true;render()};im.src=src});
function playerCount(){return byId('opponent').value==='four'?4:byId('opponent').value==='three'?3:2}
function initial(count=playerCount()){const mid=Math.floor(N/2),p=[{x:mid,y:N-1,dir:1},{x:mid,y:0,dir:-1},{x:0,y:mid,dir:1},{x:N-1,y:mid,dir:-1}].slice(0,count);return {p,w:[],stock:Array(count).fill(count===2?10:count===3?6:5),turn:Math.floor(Math.random()*count),winner:null,moves:0}}
function atGoal(p,i){return i===0?p.y===0:i===1?p.y===N-1:i===2?p.x===N-1:p.x===0}
function occupied(s,p){return s.p.some(q=>q.x===p.x&&q.y===p.y)}
const copy=s=>JSON.parse(JSON.stringify(s));
function inside(x,y){return x>=0&&x<N&&y>=0&&y<N}
function blocked(s,a,b){return s.w.some(w=>w.o==='h'?a.y!==b.y&&Math.min(a.y,b.y)===w.y&&a.x>=w.x&&a.x<=w.x+1:a.x!==b.x&&Math.min(a.x,b.x)===w.x&&a.y>=w.y&&a.y<=w.y+1)}
function neighbours(s,p){return [[0,-1],[0,1],[-1,0],[1,0]].map(([dx,dy])=>({x:p.x+dx,y:p.y+dy})).filter(q=>inside(q.x,q.y)&&!blocked(s,p,q))}
function legalMoves(s,i){const p=s.p[i],out=[];for(const q of neighbours(s,p)){if(!occupied(s,q)){out.push(q);continue}const jump={x:q.x+(q.x-p.x),y:q.y+(q.y-p.y)};if(inside(jump.x,jump.y)&&!blocked(s,q,jump)){if(!occupied(s,jump))out.push(jump)}else for(const d of neighbours(s,q))if((q.x===p.x?d.y===q.y:d.x===q.x)&&!occupied(s,d))out.push(d)}return out.filter((p,j,a)=>a.findIndex(q=>q.x===p.x&&q.y===p.y)===j)}
function distance(s,i){const q=[{...s.p[i],d:0}],seen=new Set([s.p[i].x+','+s.p[i].y]);for(let j=0;j<q.length;j++){const p=q[j];if(atGoal(p,i))return p.d;for(const n of neighbours(s,p)){const k=n.x+','+n.y;if(!seen.has(k)){seen.add(k);q.push({...n,d:p.d+1})}}}return Infinity}
function wallOK(s,w){if(!['h','v'].includes(w.o)||!Number.isInteger(w.x)||!Number.isInteger(w.y)||w.x<0||w.y<0||w.x>=N-1||w.y>=N-1)return false;if(s.w.some(a=>a.o===w.o?(a.o==='h'?a.y===w.y&&Math.abs(a.x-w.x)<2:a.x===w.x&&Math.abs(a.y-w.y)<2):a.x===w.x&&a.y===w.y))return false;const t={...s,w:[...s.w,w]};return t.p.every((_,i)=>Number.isFinite(distance(t,i)))}
function place(el,x,y,w,h){Object.assign(el.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'})}
function render(){board.replaceChildren();const active=!busy&&state.winner===null&&!(byId('opponent').value==='cpu'&&state.turn===1);const legal=legalMoves(state,state.turn);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const el=document.createElement('button');el.className='cell';el.setAttribute('aria-label',`Row ${y+1}, column ${x+1}`);place(el,x*100/N,y*100/N,CELL,CELL);if(active&&mode==='move'&&legal.some(p=>p.x===x&&p.y===y)){el.classList.add('legal');el.onclick=()=>act({x,y})}else el.disabled=true;board.append(el)}
for(const w of state.w){const el=document.createElement('div');el.className='wall';wallPosition(el,w);board.append(el)}
if(active&&mode!=='move'&&state.stock[state.turn]>0)for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){const w={x,y,o:mode},el=document.createElement('button');el.className='slot';el.setAttribute('aria-label',`${mode==='h'?'Horizontal':'Vertical'} wall at row ${y+1}, column ${x+1}`);wallPosition(el,w,true);if(!wallOK(state,w))el.classList.add('bad');el.onclick=()=>act(w);board.append(el)}
state.p.forEach((p,i)=>{const el=document.createElement('div');el.className='pawn '+(p.dir===1?'right':'')+(state.winner===null&&i===state.turn&&!busy?' stepping':'');el.dataset.player=i;el.id='pawn'+i;place(el,p.x*100/N,p.y*100/N,CELL,CELL);const sprite=document.createElement('div');if(loaded[i]){sprite.className='sprite';sprite.style.backgroundImage=`url("${images[i]}")`}else sprite.className='fallback';el.append(sprite);board.append(el)});
byId('stocks').innerHTML=state.stock.map((n,i)=>`<span class="wall-count" aria-label="${names[i]} walls: ${n}"><i class="count-square ${colors[i]}" aria-hidden="true"></i><b>${n}</b></span>`).join('');byId('blueGoal').hidden=state.p.length<3;byId('yellowGoal').hidden=state.p.length<4;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.disabled=!active});byId('undo').disabled=!history.length;}
function wallPosition(el,w,hit=false){const a=100/N;if(hit){const length=a*.8,thickness=2.6,cx=(w.x+1)*a-.55,cy=(w.y+1)*a-.55;if(w.o==='h')place(el,cx-length/2,cy-thickness/2,length,thickness);else place(el,cx-thickness/2,cy-length/2,thickness,length);return}if(w.o==='h')place(el,w.x*a,(w.y+1)*a-1,a*2-1.1,1.1);else place(el,(w.x+1)*a-1,w.y*a,1.1,a*2-1.1)}
function message(t){const el=byId('message'),win=state.winner!==null&&Boolean(t);el.textContent=t;el.classList.toggle('win',win);el.style.color=win?`var(--${colors[state.winner]})`:''}
function act(action,cpu=false){if(busy||state.winner!==null||(!cpu&&state.turn===1&&byId('opponent').value==='cpu'))return;const i=state.turn;if(action.o){if(!state.stock[i]||!wallOK(state,action)){message('Cannot place a wall here.');return}}else if(!legalMoves(state,i).some(p=>p.x===action.x&&p.y===action.y))return;history.push(copy(state));if(action.o){state.w.push(action);state.stock[i]--}else{const p=state.p[i];if(action.x!==p.x)p.dir=action.x>p.x?1:-1;p.x=action.x;p.y=action.y}finish()}
function finish(){state.moves++;if(atGoal(state.p[state.turn],state.turn))state.winner=state.turn;else state.turn=(state.turn+1)%state.p.length;mode='move';render();message(state.winner!==null?`${names[state.winner].toUpperCase()} WIN`:state.turn===1&&byId('opponent').value==='cpu'?'CPU thinking…':'');scheduleCPU()}
function cpuChoice(s){const i=s.turn,j=1-i,moves=legalMoves(s,i);let best=moves[0],score=Infinity;for(const m of moves){const t=copy(s);t.p[i]={...t.p[i],...m};if(atGoal(m,i))return m;const d=distance(t,i);if(d<score){score=d;best=m}}if(!s.stock[i])return best;const own=distance(s,i),opp=distance(s,j);let bestGain=0.65;for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++)for(const o of ['h','v']){const w={x,y,o};if(!wallOK(s,w))continue;const t={...s,w:[...s.w,w]},od=distance(t,j),sd=distance(t,i),gain=(od-opp)-(sd-own)*1.3;if(gain>bestGain&&(opp<=own+2||od-opp>=3)){bestGain=gain;best=w}}return best}
function scheduleCPU(){if(state.winner===null&&state.turn===1&&byId('opponent').value==='cpu'){const token=epoch;timer=setTimeout(()=>{if(token===epoch)act(cpuChoice(state),true)},450)}}
function cancel(){epoch++;clearTimeout(timer);busy=false}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();message('')});byId('reset').onclick=startGame;byId('opponent').onchange=()=>byId('reset').click();byId('undo').onclick=()=>{if(!history.length)return;cancel();state=history.pop();if(byId('opponent').value==='cpu')while(state.turn===1&&history.length)state=history.pop();mode='move';render();message('Move undone.');scheduleCPU()};startGame();
function startGame(){cancel();state=initial();history=[];mode='move';render();message(byId('opponent').value==='cpu'&&state.turn===1?'CPU thinking…':'');scheduleCPU()}
</script></body></html>
