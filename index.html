<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コリドール — 2人対戦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23202020'/%3E%3Ccircle cx='11' cy='11' r='6' fill='%23b4b4b4'/%3E%3Cpath d='M8 23h19' stroke='%23eeeeee' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--ink:#eeeeee;--muted:#b4b4b4;--page:#202020;--surface:#303030;--tile:#494949;font-family:ui-monospace,"SFMono-Regular",Consolas,"Noto Sans JP",monospace;background:var(--page);color:var(--ink)}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:4px}button:disabled{cursor:default}main{max-width:608px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:8px}h1{font-size:26px;margin:0;letter-spacing:.12em}header span{font-size:14px;color:var(--muted)}
.toolbar{padding:10px 0 0;margin:0}.turn{font-size:21px;font-weight:800;margin:12px 0 16px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mode{border:2px solid var(--muted);border-radius:0;background:var(--surface);color:var(--ink);min-height:48px;text-align:center;padding:10px 8px;font-size:15px;font-weight:700;box-shadow:3px 3px 0 #101010}.mode:hover:not(:disabled){background:var(--tile)}.mode.selected{background:var(--ink);border-color:var(--ink);color:var(--page);box-shadow:3px 3px 0 var(--muted)}.mode:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #101010}.mode:disabled{opacity:.4}.message{min-height:1.7em;font-size:14px;line-height:1.7;margin:10px 0 0;color:var(--muted)}.message.error{color:var(--ink);font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}.play{min-width:0}.goal{height:8px;margin:8px 0;background:var(--muted)}.goal.bottom{background:var(--ink)}.board{position:relative;aspect-ratio:1;width:100%;background:var(--page);border:10px solid var(--surface);outline:2px solid var(--muted);outline-offset:2px;touch-action:manipulation}.cell{position:absolute;width:9.434%;height:9.434%;border:0;border-radius:0;background:var(--tile);display:grid;place-items:center;padding:0}.cell.legal{outline:2px solid var(--muted);outline-offset:-2px}.cell.legal:after{content:"";width:15%;height:15%;background:var(--ink)}.cell.legal:hover{background:#606060}/* Each PNG is a 96x48 sheet: closed feet on the left, open feet on the right. */
.pawn{position:relative;display:block;width:min(48px,100%);aspect-ratio:1;overflow:hidden;background:transparent;image-rendering:pixelated;pointer-events:none}
.traveler{position:absolute;width:9.434%;height:9.434%;display:grid;place-items:center;pointer-events:none;z-index:8}
.pawn.face-right{transform:scaleX(-1)}
.pawn.face-left{transform:scaleX(1)}
.pawn .sprite{position:absolute;top:0;left:0;display:block;width:200%;height:100%;max-width:none;image-rendering:pixelated;animation:mouse-step 400ms steps(1,end) infinite}
@keyframes mouse-step{0%{transform:translateX(0)}50%{transform:translateX(-50%)}100%{transform:translateX(0)}}
.wall{position:absolute;background:var(--ink);pointer-events:none;z-index:3}.wall.h{width:20.755%;height:1.887%}.wall.v{width:1.887%;height:20.755%}.anchor{position:absolute;width:5.66%;height:5.66%;transform:translate(-50%,-50%);border:0;background:var(--page);color:var(--muted);font-size:20px;font-weight:bold;padding:0;display:grid;place-items:center;z-index:4}.anchor:hover,.anchor:focus-visible{color:var(--page);background:var(--ink)}.ghost{opacity:.75;background:var(--ink);z-index:2}.ghost.bad{opacity:.8;background:repeating-linear-gradient(45deg,var(--ink) 0 3px,var(--page) 3px 6px)}
.panel{padding-top:0}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.player{border:2px solid var(--tile);padding:12px;background:var(--surface)}.player.active{border-color:var(--tone);box-shadow:0 4px 0 var(--tone)}.player b{display:block;color:var(--tone);font-size:14px;white-space:nowrap}.player strong{display:inline-block;font-size:28px;margin-top:6px;margin-right:5px}.player small{font-size:14px;color:var(--muted)}.secondary{display:flex;gap:10px}.secondary button{padding:10px 12px;background:var(--surface);border:2px solid var(--muted);color:var(--ink);font-size:14px;box-shadow:2px 2px 0 #101010}.secondary button:hover:not(:disabled){background:var(--tile)}.secondary button:disabled{opacity:.4}details{margin-top:26px;border-top:2px solid var(--tile);padding-top:14px;color:var(--muted);font-size:14px;line-height:1.8}summary{cursor:pointer;color:var(--ink)}details p{margin:10px 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
@media(max-width:760px){main{padding:16px 14px}header{padding-bottom:10px}h1{font-size:23px}.toolbar{padding:10px 0 0}.turn{font-size:18px;margin:10px 0 12px}.mode{font-size:14px;min-height:44px;padding:9px 3px}.message{line-height:1.6}.layout{grid-template-columns:1fr;gap:8px}.play{width:100%}.board{border-width:8px}.panel{padding-top:0}.players{margin-bottom:16px}.player{padding:10px 12px}.player strong{font-size:24px}details{margin-top:20px}.footer{margin-top:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head><body><main>
<header><h1>コリドール</h1><span>2人対戦</span></header>
<div id="turn" class="turn" aria-live="polite"></div>

<div class="layout"><section class="play" aria-label="ゲーム盤">
<div class="goal top" role="img" aria-label="灰色の駒・プレイヤー1のゴール" title="プレイヤー1のゴール"></div><div id="board" class="board" aria-label="9×9の盤面"></div><div class="goal bottom" role="img" aria-label="白色の駒・プレイヤー2のゴール" title="プレイヤー2のゴール"></div>
<section class="toolbar" aria-label="対局の操作">
<div class="controls" aria-label="操作モード"><button class="mode" data-mode="move">駒を動かす</button><button class="mode" data-mode="h">横の壁を置く</button><button class="mode" data-mode="v">縦の壁を置く</button></div>
<p id="message" class="message" role="status"></p>
</section>
</section><aside class="panel">
<div class="players"><div id="player0" class="player" style="--tone:#b4b4b4"><b>● プレイヤー1</b><strong id="count0">10</strong><small>枚の壁</small></div><div id="player1" class="player" style="--tone:#eeeeee"><b>● プレイヤー2</b><strong id="count1">10</strong><small>枚の壁</small></div></div>
<div class="secondary"><button id="undo">1手戻す</button><button id="reset">最初から</button></div>
<details><summary>遊び方</summary><p>灰色の駒は上の灰色の帯、白色の駒は下の白い帯を目指します。先に到達させた人が勝ち。1手で「駒の移動」か「壁1枚の設置」を選びます。</p><p>駒は上下左右へ1マス移動。相手が隣にいるときは飛び越えられます。相手の後ろが壁や盤面の端なら、相手の横へ回り込めます。</p><p>壁は2マス分。重なりや交差は不可で、どちらかのゴールへの道を完全に塞ぐこともできません。</p><p>壁モードではマスの間の「＋」を押して設置します。PCではマウスを重ねると置く位置が見えます。</p></details>
</aside></div><div class="footer">コリドール · 2人対戦</div></main>
<script>
'use strict';
const N=9, dirs=[[1,0],[-1,0],[0,1],[0,-1]];
let state, history=[], mode='move', moving=false;
const board=document.getElementById('board'), message=document.getElementById('message');
const inside=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
function fresh(){return {pawns:[{r:8,c:4},{r:0,c:4}],facing:['right','left'],remaining:[10,10],walls:[],turn:0,winner:null};}
function blocked(a,b,walls=state.walls){
 if(a.r!==b.r){const r=Math.min(a.r,b.r);return walls.some(w=>w.o==='h'&&w.r===r&&(a.c===w.c||a.c===w.c+1));}
 const c=Math.min(a.c,b.c);return walls.some(w=>w.o==='v'&&w.c===c&&(a.r===w.r||a.r===w.r+1));
}
function moves(s=state){
 const me=s.pawns[s.turn],other=s.pawns[1-s.turn],out=[];
 for(const [dr,dc] of dirs){const next={r:me.r+dr,c:me.c+dc};if(!inside(next.r,next.c)||blocked(me,next,s.walls))continue;
  if(next.r!==other.r||next.c!==other.c){out.push(next);continue;}
  const jump={r:next.r+dr,c:next.c+dc};
  if(inside(jump.r,jump.c)&&!blocked(next,jump,s.walls))out.push(jump);
  else for(const [sr,sc] of (dr!==0?[[0,1],[0,-1]]:[[1,0],[-1,0]])){const side={r:next.r+sr,c:next.c+sc};if(inside(side.r,side.c)&&!blocked(next,side,s.walls))out.push(side);}
 }
 return out.filter((p,i)=>out.findIndex(q=>q.r===p.r&&q.c===p.c)===i);
}
function hasPath(start,goal,walls){
 const queue=[start],seen=new Set([start.r*9+start.c]);
 for(let i=0;i<queue.length;i++){const a=queue[i];if(a.r===goal)return true;for(const [dr,dc] of dirs){const b={r:a.r+dr,c:a.c+dc},key=b.r*9+b.c;if(inside(b.r,b.c)&&!seen.has(key)&&!blocked(a,b,walls)){seen.add(key);queue.push(b);}}}return false;
}
function wallError(w,s=state){
 if(s.winner!==null)return 'ゲームは終了しています。';
 if(!s.remaining[s.turn])return '壁を使い切りました。駒を動かしてください。';
 if(!['h','v'].includes(w.o)||w.r<0||w.r>7||w.c<0||w.c>7)return '盤面の外には置けません。';
 for(const a of s.walls){if(a.o!==w.o&&a.r===w.r&&a.c===w.c)return '壁を交差させることはできません。';if(a.o===w.o&&(w.o==='h'?a.r===w.r&&Math.abs(a.c-w.c)<=1:a.c===w.c&&Math.abs(a.r-w.r)<=1))return 'ほかの壁と重なっています。';}
 const walls=[...s.walls,w];if(!hasPath(s.pawns[0],0,walls)||!hasPath(s.pawns[1],8,walls))return 'ゴールへの道を完全に塞ぐことはできません。';return '';
}
function tell(text,error=false){message.textContent=text;message.classList.toggle('error',error);}
function save(){history.push(JSON.parse(JSON.stringify(state)));}
function finish(){const player=state.turn;if(state.pawns[player].r===(player===0?0:8))state.winner=player;else state.turn=1-player;mode='move';render();}
async function moveTo(r,c){
 if(moving||state.winner!==null||mode!=='move')return;
 if(!moves().some(p=>p.r===r&&p.c===c)){tell('目印のあるマスに移動できます。',true);return;}
 save();const player=state.turn,previous=state.pawns[player];
 if(c<previous.c)state.facing[player]='left';else if(c>previous.c)state.facing[player]='right';
 moving=true;
 board.querySelectorAll('button').forEach(btn=>btn.disabled=true);
 board.querySelectorAll('.legal').forEach(el=>el.classList.remove('legal'));
 document.querySelectorAll('[data-mode]').forEach(btn=>btn.disabled=true);
 document.getElementById('undo').disabled=true;document.getElementById('reset').disabled=true;
 tell('移動中…');
 const pawn=board.querySelector('.pawn.p'+player);
 try{
  if(pawn){
   pawn.className='pawn p'+player+' face-'+state.facing[player];
   const traveler=document.createElement('div');traveler.className='traveler';
   position(traveler,previous.c*12,previous.r*12);traveler.append(pawn);board.append(traveler);
   const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.min(600,400*Math.hypot(r-previous.r,c-previous.c));
   if(duration>0){
    const motion=traveler.animate([
     {left:(previous.c*12/106*100)+'%',top:(previous.r*12/106*100)+'%'},
     {left:(c*12/106*100)+'%',top:(r*12/106*100)+'%'}
    ],{duration,easing:'linear',fill:'forwards'});
    await motion.finished;
   }
  }
 }catch(error){/* Complete the legal move even if the browser cancels its animation. */}
 finally{state.pawns[player]={r,c};moving=false;finish();}
}
function place(w){if(moving)return;const error=wallError(w);if(error){tell(error,true);return;}save();state.walls.push(w);state.remaining[state.turn]--;finish();}
function position(el,x,y){el.style.left=(x/106*100)+'%';el.style.top=(y/106*100)+'%';}
function wallElement(w,ghost=false,bad=false){const el=document.createElement('div');el.className='wall '+w.o+(ghost?' ghost':'')+(bad?' bad':'');position(el,w.c*12+(w.o==='v'?10:0),w.r*12+(w.o==='h'?10:0));if(ghost)el.id='ghost';return el;}
function clearGhost(){document.getElementById('ghost')?.remove();}
function preview(w){clearGhost();board.append(wallElement(w,true,!!wallError(w)));}
function render(){
 board.replaceChildren();const legal=moves();
 for(let r=0;r<9;r++)for(let c=0;c<9;c++){
  const el=document.createElement('button');el.className='cell';position(el,c*12,r*12);el.setAttribute('aria-label',`${r+1}行${c+1}列`);const player=state.pawns.findIndex(p=>p.r===r&&p.c===c);
  if(player>=0){const pawn=document.createElement('span');pawn.className='pawn p'+player+' face-'+state.facing[player];const sprite=document.createElement('img');sprite.className='sprite';sprite.src=player===0?'gray_mouse.png':'white_mouse.png';sprite.alt='';sprite.draggable=false;pawn.append(sprite);el.append(pawn);el.setAttribute('aria-label',`プレイヤー${player+1}の駒、${r+1}行${c+1}列`);}
  const canMove=state.winner===null&&mode==='move'&&legal.some(p=>p.r===r&&p.c===c);if(canMove)el.classList.add('legal');el.disabled=!canMove;el.onclick=()=>moveTo(r,c);board.append(el);
 }
 state.walls.forEach(w=>board.append(wallElement(w)));
 if(mode!=='move'&&state.winner===null)for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const w={r,c,o:mode},el=document.createElement('button');el.className='anchor';el.textContent='+';position(el,c*12+11,r*12+11);el.setAttribute('aria-label',`${r+1}行${c+1}列を起点に${mode==='h'?'横':'縦'}の壁を置く`);el.onclick=()=>place(w);el.onmouseenter=()=>preview(w);el.onmouseleave=clearGhost;el.onfocus=()=>preview(w);el.onblur=clearGhost;board.append(el);
 }
 document.getElementById('turn').textContent=state.winner===null?`プレイヤー${state.turn+1}の番`:`プレイヤー${state.winner+1}の勝ち！`;
 for(let i=0;i<2;i++){document.getElementById('count'+i).textContent=state.remaining[i];document.getElementById('player'+i).classList.toggle('active',i===(state.winner??state.turn));}
 document.querySelectorAll('[data-mode]').forEach(btn=>{btn.classList.toggle('selected',btn.dataset.mode===mode);btn.setAttribute('aria-pressed',btn.dataset.mode===mode);btn.disabled=state.winner!==null||(btn.dataset.mode!=='move'&&!state.remaining[state.turn]);});
 document.getElementById('undo').disabled=moving||!history.length;document.getElementById('reset').disabled=moving;
 tell(state.winner!==null?'ゴールに到達しました。「最初から」でまた遊べます。':mode==='move'?'目印のあるマスを押して、駒を動かしてください。':`${mode==='h'?'横':'縦'}の壁を置きます。マスの間の「＋」を押してください。`);
}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{if(moving)return;mode=btn.dataset.mode;render();});
document.getElementById('undo').onclick=()=>{if(moving)return;if(history.length){state=history.pop();mode='move';render();}};
document.getElementById('reset').onclick=()=>{if(moving)return;if(history.length&&!confirm('対局を最初からやり直しますか？'))return;state=fresh();history=[];mode='move';render();};
state=fresh();render();
</script></body></html>
